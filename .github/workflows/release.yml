name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z)
        required: true
        type: string

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches package version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PKG="$(node -p "require('./app/package.json').version")"
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "tag $TAG does not match app/package.json version $PKG" >&2
            exit 1
          fi
      - name: Install
        run: cd app && npm ci
      - name: Build renderer + electron
        run: cd app && npm run build
      - name: Build AppImage
        # --publish never: electron-builder auto-publishes on CI when a publish
        # config is present, which fails here (no GH_TOKEN on this step). We
        # build only and attach in the next step via gh.
        run: cd app && npx electron-builder --linux AppImage --publish never
      - name: Attach AppImage to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/dist/*.AppImage --clobber
          else
            gh release create "$TAG" app/dist/*.AppImage --title "$TAG" --generate-notes
          fi
