name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y mkvtoolnix ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run pytest
        run: python3 -m pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y mkvtoolnix ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: cd app && npm ci
      - name: Test
        run: cd app && npm test
      - name: svelte-check
        run: cd app/renderer && npm run check
      - name: Build
        run: cd app && npm run build
